<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central de Calculadoras</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <section class="hero">
      <h1>Bem-vindo</h1>
      <p>Escolha a calculadora que deseja utilizar</p>
    </section>

    <section class="calculadoras">

      <div class="card">
        <div class="imagem">Imagem</div>
        <h2>Calculadora Matemática</h2>
        <a href="#">Acessar</a>
      </div>

      <div class="card">
        <div class="imagem">Imagem</div>
        <h2>Conversão de Moedas</h2>
        <a href="#">Acessar</a>
      </div>

      <div class="card">
        <div class="imagem">Imagem</div>
        <h2>Calculadora de Idade</h2>
        <a href="#">Acessar</a>
      </div>

      <div class="card">
        <div class="imagem">Imagem</div>
        <h2>Dígito de CPF</h2>
        <a href="#">Acessar</a>
      </div>

      <div class="card">
        <div class="imagem">Imagem</div>
        <h2>Medida Escolar</h2>
        <a href="#">Acessar</a>
      </div>

      <div class="card">
        <div class="imagem">Imagem</div>
        <h2>Juros Compostos</h2>
        <a href="#">Acessar</a>
      </div>

    </section>
  </main>
  <style>
    * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  min-height: 100vh;
  background: #f4f6f8;
  color: #222;
}

.container {
  width: 90%;
  max-width: 1100px;
  margin: 0 auto;
  padding: 50px 0;
}

.hero {
  text-align: center;
  margin-bottom: 50px;
}

.hero h1 {
  font-size: 42px;
  text-transform: uppercase;
  margin-bottom: 10px;
}

.hero p {
  font-size: 22px;
  color: #555;
}

.calculadoras {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 25px;
}

.card {
  background: white;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 5px 15px rgba(0,0,0,0.12);
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-8px);
}

.imagem {
  height: 130px;
  background: #222;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
}

.card h2 {
  font-size: 20px;
  text-align: center;
  padding: 20px 10px;
}

.card a {
  display: block;
  width: 120px;
  margin: 0 auto 20px;
  padding: 10px;
  text-align: center;
  background: #111;
  color: white;
  text-decoration: none;
  border-radius: 20px;
  transition: 0.3s;
}

.card a:hover {
  background: #444;
}

@media (max-width: 850px) {
  .calculadoras {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 550px) {
  .calculadoras {
    grid-template-columns: 1fr;
  }

  .hero h1 {
    font-size: 32px;
  }

  .hero p {
    font-size: 18px;
  }
}
  </style>

</body>
</html>
