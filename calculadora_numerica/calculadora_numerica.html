<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/calculadora_numerica.css">
</head>
<body>
    <div id="background">
    <a href="resumo.html"><img src="../img/voltar_botao.png" alt="botao" id="voltar"></a>
    <h1 align = "center">CALCULADORA BÁSICA</h1>
    <div class="calculadora">
        <h1>CALCULADORA</h1>
        <p id="resultado">r</p>
        <table>
            <tr>
                <td class="botao"><button>&lt;</button></td>
                <td class="botao"><button>C</button></td>
                <td class="botao"><button>/</button></td>
                <td class="botao"><button>X</button></td>
            </tr>
            <tr>
                <td class="botao"><button>7</button></td>
                <td class="botao"><button>8</button></td>
                <td class="botao"><button>9</button></td>
                <td class="botao"><button>-</button></td>
            </tr>
            <tr>
                <td class="botao"><button>4</button></td>
                <td class="botao"><button>5</button></td>
                <td class="botao"><button>6</button></td>
                <td class="botao"><button>+</button></td>
            </tr>
            <tr>
                <td class="botao"><button>1</button></td>
                <td class="botao"><button>2</button></td>
                <td class="botao"><button>3</button></td>
                <td rowspan="2"><button>=</button></td>
            </tr>
            <tr>
                <td colspan="2"><button>0</button></td>
                <td class="botao"><button>,</button></td>
            </tr>
        </table>
    </div>
    </div>
    

    <script src="js/calculadora_numerica.js">   </script>
</body>
</html>
